<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Padhlo</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f6f7fb;
  color:#171923;
}

.container{
  width:min(92%,700px);
  margin:auto;
  padding:35px 0;
}

.logo{
  font-size:28px;
  font-weight:800;
}

.logo span{
  font-weight:400;
}

.tagline{
  color:#777b88;
  margin-top:6px;
  font-size:14px;
}

.hero{
  margin-top:80px;
}

.small-title{
  font-size:12px;
  letter-spacing:2px;
  font-weight:bold;
  color:#777b88;
}

h1{
  font-size:clamp(35px,8vw,55px);
  line-height:1.05;
  letter-spacing:-2px;
  margin:12px 0;
}

.subtitle{
  color:#777b88;
  margin-bottom:30px;
}

.options{
  display:grid;
  gap:15px;
}

.option{
  width:100%;
  padding:20px;
  background:white;
  border:1px solid #e2e4eb;
  border-radius:18px;
  display:flex;
  align-items:center;
  gap:15px;
  text-align:left;
  font-size:16px;
  cursor:pointer;
}

.option:hover{
  transform:translateY(-2px);
}

.icon{
  width:55px;
  height:55px;
  background:#f0f1f6;
  border-radius:15px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:25px;
}

.option strong{
  display:block;
  margin-bottom:5px;
}

.option small{
  color:#777b88;
}

.arrow{
  margin-left:auto;
  font-size:22px;
  color:#777b88;
}

.hidden{
  display:none;
}

.back{
  border:0;
  background:none;
  font-size:15px;
  color:#666;
  cursor:pointer;
  margin-bottom:25px;
}

h2{
  font-size:30px;
}

.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
}

.card{
  padding:22px 15px;
  background:white;
  border:1px solid #e2e4eb;
  border-radius:15px;
  font-weight:bold;
  font-size:16px;
}

footer{
  text-align:center;
  color:#999;
  font-size:12px;
  margin-top:80px;
}
</style>
</head>

<body>

<div class="container">

<header>
<div class="logo">Padh<span>lo</span></div>
<div class="tagline">
Study smarter. Learn better.
</div>
</header>

<section id="home" class="hero">

<div class="small-title">WELCOME</div>

<h1>
What do you want to prepare for?
</h1>

<p class="subtitle">
Choose one. We'll keep everything simple.
</p>

<div class="options">

<button class="option" onclick="showSchool()">

<div class="icon">📚</div>

<div>
<strong>School Study</strong>
<small>Class 9 • 10 • 11 • 12</small>
</div>

<div class="arrow">→</div>

</button>


<button class="option" onclick="showEntrance()">

<div class="icon">🎯</div>

<div>
<strong>Entrance Preparation</strong>
<small>JMI • AMU</small>
</div>

<div class="arrow">→</div>

</button>

</div>

</section>


<section id="school" class="hidden">

<button class="back" onclick="goHome()">← Back</button>

<h2>Choose your class</h2>

<div class="grid">

<button class="card">Class 9</button>
<button class="card">Class 10</button>
<button class="card">Class 11</button>
<button class="card">Class 12</button>

</div>

</section>


<section id="entrance" class="hidden">

<button class="back" onclick="goHome()">← Back</button>

<h2>Entrance Preparation</h2>

<div class="grid">

<button class="card">🎯 JMI</button>
<button class="card">🎓 AMU</button>

</div>

</section>


<footer>
Padhlo • Learn better
</footer>

</div>


<script>

function hideAll(){

document.getElementById("home").classList.add("hidden");

document.getElementById("school").classList.add("hidden");

document.getElementById("entrance").classList.add("hidden");

}

function showSchool(){

hideAll();

document.getElementById("school").classList.remove("hidden");

}

function showEntrance(){

hideAll();

document.getElementById("entrance").classList.remove("hidden");

}

function goHome(){

hideAll();

document.getElementById("home").classList.remove("hidden");

}

</script>

</body>
  </html>
