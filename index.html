<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Padhlo — Study Smarter</title>
<style>

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

:root{
  --bg:#f6f7ff;
  --card:#ffffff;
  --text:#171923;
  --muted:#74798a;
  --purple:#6657f5;
  --purple2:#8b5cf6;
  --line:#e7e9f1;
}

body{
  font-family:Arial,Helvetica,sans-serif;
  background:
    radial-gradient(
      circle at 0% 0%,
      rgba(102,87,245,.10),
      transparent 30%
    ),
    var(--bg);
  color:var(--text);
  min-height:100vh;
}

button{
  font:inherit;
}

#app{
  width:92%;
  max-width:850px;
  margin:auto;
  padding:24px 0 60px;
}


/* HEADER */

.site-header{
  display:flex;
  align-items:center;
  gap:12px;
  margin-bottom:55px;
}

.logo-box{
  width:50px;
  height:50px;
  border-radius:16px;

  display:flex;
  align-items:center;
  justify-content:center;

  background:linear-gradient(
    135deg,
    var(--purple),
    var(--purple2)
  );

  color:white;
  font-size:24px;
  font-weight:900;

  box-shadow:
    0 10px 25px
    rgba(102,87,245,.25);

  position:relative;
  overflow:hidden;
}


/* Small book effect */

.logo-box::after{
  content:"";
  position:absolute;

  width:20px;
  height:13px;

  border:2px solid rgba(255,255,255,.8);
  border-top:0;

  bottom:9px;
  left:15px;

  border-radius:0 0 5px 5px;

  transform:rotate(-4deg);
}


.brand-name{
  font-size:28px;
  font-weight:900;
  letter-spacing:-1.5px;
}

.brand-name span{
  font-weight:400;
}

.tagline{
  color:var(--muted);
  font-size:12px;
  margin-top:3px;
}


/* HERO */

.hero{
  background:rgba(255,255,255,.72);

  border:1px solid var(--line);

  border-radius:26px;

  padding:28px 24px;

  box-shadow:
    0 15px 40px
    rgba(40,45,80,.07);

  animation:heroIn .45s ease;
}

.creator{
  display:inline-block;

  padding:8px 12px;

  border-radius:999px;

  background:#f0efff;

  color:var(--purple);

  font-size:12px;
  font-weight:700;

  margin-bottom:20px;
}

.hero h1{
  font-size:clamp(40px,9vw,65px);

  line-height:.95;

  letter-spacing:-4px;

  margin-bottom:18px;
}

.hero h1 span{
  background:
    linear-gradient(
      90deg,
      var(--purple),
      var(--purple2)
    );

  -webkit-background-clip:text;
  background-clip:text;

  color:transparent;
}

.hero p{
  color:var(--muted);

  font-size:15px;

  line-height:1.6;

  max-width:600px;
}


/* ANIMATION */

@keyframes heroIn{

  from{
    opacity:0;
    transform:translateY(12px);
  }

  to{
    opacity:1;
    transform:translateY(0);
  }

}


/* MOBILE */

@media(max-width:520px){

  #app{
    width:90%;
  }

  .site-header{
    margin-bottom:35px;
  }

  .hero{
    padding:24px 19px;
  }

  .hero h1{
    letter-spacing:-3px;
  }

}
.options-title{
  margin-top:32px;
  margin-bottom:16px;
}

.options-title span{
  display:block;
  color:var(--purple);
  font-size:10px;
  font-weight:800;
  letter-spacing:2px;
  margin-bottom:6px;
}

.options-title strong{
  font-size:20px;
  letter-spacing:-.5px;
}


.options-list{
  display:grid;
  gap:12px;
}


.option-card{
  width:100%;
  border:1px solid var(--line);
  background:rgba(255,255,255,.94);
  border-radius:20px;
  padding:16px;

  display:flex;
  align-items:center;
  text-align:left;

  box-shadow:
    0 7px 22px
    rgba(30,35,55,.05);

  transition:
    transform .2s ease,
    box-shadow .2s ease,
    border-color .2s ease;
}


.option-card:hover{
  transform:translateY(-3px);
  box-shadow:
    0 15px 35px
    rgba(40,45,80,.10);
  border-color:#d8d4ff;
}


.option-card:active{
  transform:scale(.975);
}


.option-icon{
  width:52px;
  height:52px;
  border-radius:16px;

  display:flex;
  align-items:center;
  justify-content:center;

  font-size:23px;
  margin-right:14px;
  flex-shrink:0;
}


.purple-icon{
  background:#efedff;
}

.orange-icon{
  background:#fff3dc;
}

.blue-icon{
  background:#e9f2ff;
}

.green-icon{
  background:#e8f8f1;
}


.option-content{
  min-width:0;
}


.option-content strong{
  display:block;
  font-size:15px;
}


.option-content small{
  display:block;
  color:var(--muted);
  font-size:12px;
  margin-top:5px;
}


.option-arrow{
  margin-left:auto;
  color:#858b9a;
  font-size:22px;
  padding-left:10px;
}


@media(max-width:520px){

  .option-card{
    padding:14px;
  }

  .option-icon{
    width:48px;
    height:48px;
    margin-right:12px;
  }

  }
</style>
</head>


<body>
<div id="app">

  <!-- HEADER -->

  <header class="site-header">

    <div class="logo-box">
      P
    </div>

    <div>

      <div class="brand-name">
        Padh<span>lo</span>
      </div>

      <div class="tagline">
        Study smarter. Learn better.
      </div>

    </div>

  </header>


  <!-- HERO -->

  <main class="hero">

    <div class="creator">
      ✨ Created by Harsh Yadav
    </div>

    <h1>
      Study without the
      <span>confusion.</span>
    </h1>

    <p>
      Lectures, notes, practice and previous-year
      questions — organised in one simple place
    </p>
    <div class="options-title">
  <span>EXPLORE PADHLO</span>
  <strong>Choose what you need.</strong>
</div>

<div class="options-list">

  <button class="option-card" type="button" onclick="showPage('school')">
  <div class="option-icon purple-icon">📚</div>
  <div class="option-content">
    <strong>School Study</strong>
    <small>Class 9 • 10 • 11 • 12</small>
  </div>
  <div class="option-arrow">→</div>
</button>


<button class="option-card" type="button">
  <div class="option-icon orange-icon">🎯</div>
  <div class="option-content">
    <strong>Entrance Preparation</strong>
    <small>JMI • AMU</small>
  </div>
  <div class="option-arrow">→</div>
</button>


<button class="option-card" type="button">
  <div class="option-icon blue-icon">🤖</div>
  <div class="option-content">
    <strong>AI Study Assistant</strong>
    <small>Build your study plan</small>
  </div>
  <div class="option-arrow">→</div>
</button>

  <button class="option-card" type="button">
    <div class="option-icon green-icon">🧠</div>
    <div class="option-content">
      <strong>Aaj Kya Padhu?</strong>
      <small>Create today's study mission</small>
    </div>
    <div class="option-arrow">→</div>
  </button>

</div>
  </main>

</div>

</body>

</html>
